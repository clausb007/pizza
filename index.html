<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Wichtig für Smartphones: Skaliert die App passend für den kleinen Bildschirm -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVPN Pizza Rechner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7; /* iOS Hintergrund-Grau */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #333;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        .input-group label {
            font-size: 16px;
            color: #333;
        }
        .input-group input {
            width: 80px;
            padding: 8px;
            font-size: 16px;
            text-align: right;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #007aff; /* iOS Blau */
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        button:active {
            background-color: #005bb5;
        }
        pre {
            background-color: #f8f8f8;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            font-family: "Menlo", "Courier New", monospace;
            font-size: 14px;
            overflow-x: auto;
            margin-top: 20px;
        }
        .section-title {
            font-weight: bold;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Pizza Rechner</h2>

    <div class="section-title">Grundrezept</div>
    <div class="input-group">
        <label>Anzahl Ballen:</label>
        <input type="number" id="balls" value="4" step="1" inputmode="numeric">
    </div>
    <div class="input-group">
        <label>Gewicht (g):</label>
        <input type="number" id="weight" value="250" step="1" inputmode="numeric">
    </div>
    <div class="input-group">
        <label>Hydration (%):</label>
        <input type="number" id="hydr" value="60" step="0.1" inputmode="decimal">
    </div>
    <div class="input-group">
        <label>Salz (%):</label>
        <input type="number" id="salt" value="3.0" step="0.1" inputmode="decimal">
    </div>

    <div class="section-title">Phase 1 (z.B. Raumtemperatur)</div>
    <div class="input-group">
        <label>Zeit (h):</label>
        <input type="number" id="h1" value="2" step="0.5" inputmode="decimal">
    </div>
    <div class="input-group">
        <label>Temp (°C):</label>
        <input type="number" id="t1" value="20" step="0.5" inputmode="decimal">
    </div>

    <div class="section-title">Phase 2 (z.B. Kühlschrank)</div>
    <div class="input-group">
        <label>Zeit (h):</label>
        <input type="number" id="h2" value="24" step="0.5" inputmode="decimal">
    </div>
    <div class="input-group">
        <label>Temp (°C):</label>
        <input type="number" id="t2" value="4" step="0.5" inputmode="decimal">
    </div>

    <button onclick="calculatePizza()">Berechnen</button>

    <pre id="result">Ergebnis erscheint hier...</pre>
</div>

<script>
    // Hilfsfunktion zum Auslesen der Eingabefelder
    function getVal(id) {
        let val = parseFloat(document.getElementById(id).value);
        return isNaN(val) ? 0 : val;
    }

    // Hilfsfunktion für den schönen Kassenbon-Text (füllt Leerzeichen auf)
    function pad(numStr, length) {
        return numStr.padStart(length, ' ');
    }

    function calculatePizza() {
        const balls = getVal('balls');
        const weight = getVal('weight');
        const hydr = getVal('hydr');
        const salt = getVal('salt');
        const h1 = getVal('h1');
        const t1 = getVal('t1');
        const h2 = getVal('h2');
        const t2 = getVal('t2');

        const base_hours = 24.0;
        const base_idy = 0.12;

        // Temperaturfaktoren (Javascript nutzt Math.pow)
        const factor_phase1 = Math.pow(2, (t1 - 20.0) / 9.4);
        const factor_phase2 = Math.pow(2, (t2 - 20.0) / 9.4);

        const eff_hours = (h1 * factor_phase1) + (h2 * factor_phase2);

        if (eff_hours <= 0) {
            document.getElementById('result').innerText = "Fehler: Gesamtzeit muss > 0 sein.";
            return;
        }

        const idy_percent = (base_hours * base_idy) / eff_hours;
        const cy_percent = idy_percent * 3.0;

        const total_dough = balls * weight;
        const total_percent = 100.0 + hydr + salt + idy_percent;

        const flour = (total_dough / total_percent) * 100.0;
        const water = (hydr / 100.0) * flour;
        const salt_weight = (salt / 100.0) * flour;
        const idy_weight = (idy_percent / 100.0) * flour;
        const cy_weight = (cy_percent / 100.0) * flour;

        let p2_str = h2 > 0 ? `Phase 2:   ${h2}h bei ${t2}°C\n` : "";

        const resultText = 
`=== DEIN PIZZA REZEPT ===
Menge:     ${balls} Ballen a ${weight}g
Gesamt:    ${total_dough.toFixed(0)} g Teig
-------------------------
Phase 1:   ${h1}h bei ${t1}°C
${p2_str}=========================
ZUTATEN
Mehl:      ${pad(flour.toFixed(0), 6)} g  (100%)
Wasser:    ${pad(water.toFixed(0), 6)} g  (${hydr}%)
Salz:      ${pad(salt_weight.toFixed(1), 6)} g  (${salt}%)
-------------------------
HEFE (Nur EINE Sorte!)
Frisch:    ${pad(cy_weight.toFixed(2), 6)} g
Instant:   ${pad(idy_weight.toFixed(2), 6)} g
=========================`;

        document.getElementById('result').innerText = resultText;
    }
</script>

</body>
</html>
